<!doctype html>
<html>
<head><meta charset="utf-8"><title>Gate Crawler — play shot</title>
<style>*{margin:0}html,body{background:#05070c;overflow:hidden}#game{display:block;width:100vw;height:100vh}
#d{position:fixed;right:4px;bottom:4px;color:#6f6;font:11px monospace;margin:0}</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="d"></pre>
<script type="module">
  import { createGame } from '../src/game.js';
  import { initInput, keys, mouse } from '../src/input.js';
  import { TILE } from '../src/worldgen.js';
  import { makeFlowField } from '../src/pathfind.js';

  const qs = new URLSearchParams(location.search);
  const FRAMES = Number(qs.get('f') || 600);
  const PANEL = qs.has('panel');
  const HUB = qs.get('hub'); // '', 'research', 'infirmary', 'workbench', 'operations', 'base', 'roster', 'armory'
  const canvas = document.getElementById('game');
  const api = createGame(canvas);
  initInput(canvas);
  const g = api.g;
  if (qs.has('nofx')) g.postfx = false; // skip the webgl grade — headless swiftshader chokes on the readback
  const STEP = 1 / 60;
  const key = (c) => window.dispatchEvent(new KeyboardEvent('keydown', { code: c }));

  key('Enter');
  api.update(STEP);
  api.render(STEP);

  if (HUB !== null) {
    // land in the walkable hub and (optionally) open a station panel
    g.save.naquadah = 900;
    g.save.intel = 60;
    for (let f = 0; f < 30; f++) { api.update(STEP); api.render(STEP); }
    if (HUB) {
      const st = g.world.stations.find((s) => s.kind === HUB);
      if (st) { g.player.x = st.x; g.player.y = st.y + 10; }
      for (let f = 0; f < 6; f++) { api.update(STEP); api.render(STEP); }
      key('KeyE');
      api.update(STEP);
      g.pmouse = { x: g.view.w / 2, y: g.view.h / 2 };
      api.render(STEP);
    } else if (qs.has('room')) {
      // frame one named hub room (kind from src/hub.js ROOMS) — no panel
      const rm = g.world.rooms.find((r) => r.kind === qs.get('room'));
      if (rm) { g.player.x = rm.centerPx.x; g.player.y = rm.centerPx.y; }
      for (let f = 0; f < 30; f++) { api.update(STEP); api.render(STEP); }
    } else {
      // just walk the player a bit off the ramp for a nicer framing
      g.player.y += 40;
      for (let f = 0; f < 20; f++) { api.update(STEP); api.render(STEP); }
    }
    document.getElementById('d').textContent = `HUB ${HUB || 'floor'} | state ${g.state} station ${g.station}`;
    document.title = 'hub shot: ' + (HUB || 'floor');
    (function paint() { api.render(STEP); requestAnimationFrame(paint); })();
    throw new Error('hub-shot-done'); // stop the module here; the paint loop keeps the canvas fresh
  }

  let flow = null;
  let worldRef = null;
  function botFlow() {
    const ff = makeFlowField(g.world.grid, g.world.W, g.world.H);
    const d = g.world.dhdRoom.centerPx;
    ff.compute(
      Math.max(1, Math.min(g.world.W - 2, Math.floor(d.x / TILE))),
      Math.max(1, Math.min(g.world.H - 2, Math.floor(d.y / TILE)))
    );
    return ff;
  }

  for (let t = 1; t <= FRAMES; t++) {
    if (g.state === 'play') {
      if (g.world !== worldRef) { worldRef = g.world; flow = botFlow(); }
      const p = g.player;
      const tx = Math.max(1, Math.min(g.world.W - 2, Math.floor(p.x / TILE)));
      const ty = Math.max(1, Math.min(g.world.H - 2, Math.floor(p.y / TILE)));
      const [fx, fy] = flow.dir(tx, ty);
      for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) keys.delete(c);
      if (fx > 0.35) keys.add('KeyD');
      if (fx < -0.35) keys.add('KeyA');
      if (fy > 0.35) keys.add('KeyS');
      if (fy < -0.35) keys.add('KeyW');
      let near = null, nd = Infinity;
      for (const e of g.enemies) {
        const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
        if (d < nd) { nd = d; near = e; }
      }
      const tg = near || { x: p.x + Math.cos(p.aim) * 120, y: p.y + Math.sin(p.aim) * 120 };
      mouse.x = tg.x - g.cam.x + g.view.w / 2;
      mouse.y = tg.y - g.cam.y + g.view.h / 2;
      mouse.down = true;
      if (near && Math.sqrt(nd) < 210 && p.dodgeCd <= 0) key('Space');
      if (g.dhdActive) key('KeyE');
    } else if (g.state === 'gatemap') {
      const node = g.buttons.find((b) => b.w >= 100 && b.h <= 60);
      if (node) node.fn();
    } else if (g.state === 'hub') {
      g.player.x = g.world.gateCenter.x;
      g.player.y = g.world.gateCenter.y;
      key('KeyE');
    } else {
      key('Enter');
    }
    api.update(STEP);
    api.render(STEP);
  }

  // ?mob=all | ?mob=jaffa,wraith_drone — pin a line-up of enemy kinds next to
  // the player and hold them there so the models can be inspected in isolation.
  // extras: &variant=jaffa|wraith|replicator (boss), &phase=1 (stalker phased),
  // &gear=1 (equip the player) so the armour plating shows.
  const MOB = qs.get('mob');
  if (MOB) {
    const { Enemy } = await import('../src/entities.js');
    const ALL = ['jaffa', 'jaffa_heavy', 'jaffa_grenadier', 'jaffa_sniper', 'wraith', 'wraith_drone',
      'wraith_stalker', 'replicator', 'replicator_brute', 'replicator_weaver', 'scavenger', 'boss'];
    const kinds = MOB === 'all' ? ALL : MOB.split(',');
    for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) keys.delete(c);
    mouse.down = false;
    if (qs.has('gear')) {
      g.inv.equip.head = { id: 'a_helm', count: 1, rarity: 'epic' };
      g.inv.equip.torso = { id: 'a_plate', count: 1, rarity: 'epic' };
      g.inv.equip.legs = { id: 'a_greaves', count: 1 };
      g.inv.equip.feet = { id: 'a_boots', count: 1 };
      if (qs.get('gear') !== '1') g.inv.equip.weapon1 = { id: qs.get('gear'), count: 1 };
    }
    g.enemies.length = 0;
    const p = g.player;
    const slots = [];
    kinds.forEach((k, i) => {
      const x = p.x - 110 + (i % 4) * 74;
      const y = p.y - 78 + ((i / 4) | 0) * 74;
      const e = new Enemy(k, x, y, 4, { variant: qs.get('variant') || 'jaffa' });
      e.state = 'active';
      e._room = g.curRoom;
      e.facing = Math.atan2(p.y - y, p.x - x);
      const sv = qs.has('still') ? 0 : 0.7;
      const vx = Math.cos(e.facing) * e.speed * sv;
      const vy = Math.sin(e.facing) * e.speed * sv;
      if (k === 'jaffa_sniper') e.aimT = 0.9;
      if (k === 'wraith_stalker' && qs.has('phase')) e.phaseT = 0.5;
      if (k === 'replicator_weaver') e.weaveT = 3;
      g.enemies.push(e);
      slots.push({ e, x, y, vx, vy, ph: e.phaseT });
    });
    document.getElementById('d').textContent = 'MOB ' + kinds.join(' ');
    document.title = 'mob shot: ' + MOB;
    (function paint() {
      api.update(STEP);
      for (const s of slots) {
        s.e.x = s.x;
        s.e.y = s.y;
        s.e.vx = s.vx;
        s.e.vy = s.vy;
        s.e.state = 'active';
        s.e.hp = s.e.maxHp;
        s.e.alive = true;
        s.e.phaseT = s.ph;
        if (g.enemies.indexOf(s.e) < 0) g.enemies.push(s.e);
      }
      p.hp = p.maxHp;
      p.iframe = 0.2;
      p.x = slots.length ? p.x : p.x;
      api.render(STEP);
      requestAnimationFrame(paint);
    })();
    throw new Error('mob-shot-done');
  }

  if (PANEL) {
    // stock the inventory so the panel has something to show, then open it
    for (const id of ['medkit', 'stim', 'shieldcell', 'frag', 'a_helm', 'a_plate', 'a_greaves', 'a_boots', 'w_staff', 'w_zat', 'bandage']) {
      const iv = g.inv;
      const free = iv.grid.findIndex((c) => !c);
      if (free >= 0) iv.grid[free] = { id, count: id === 'bandage' ? 6 : id === 'frag' ? 3 : 1 };
    }
    g.inv.equip.head = { id: 'a_visor', count: 1 };
    g.inv.equip.torso = { id: 'a_vest', count: 1 };
    g.inv.equip.grenade = { id: 'frag', count: 2 };
    g.inv.hotbar[1] = { id: 'medkit', count: 2 };
    g.inv.hotbar[2] = { id: 'stim', count: 3 };
    key('Tab');
    api.update(STEP);
    api.render(STEP);
    g.pmouse = { x: g.view.w / 2 + 40, y: g.view.h / 2 };
    api.render(STEP);
  }

  const p = g.player;
  document.getElementById('d').textContent =
    `frames ${FRAMES} | ${g.state} hop${g.hop} panel${g.panelOpen} ` +
    `pos ${p.x | 0},${p.y | 0} hp${p.hp | 0} enemies ${g.enemies.length} idle ${g.enemies.filter((e) => e.state === 'idle').length}`;
  document.title = 'shot ready: ' + g.state + ' hop' + g.hop;

  // keep compositing fresh pixels so --screenshot captures the final frame
  (function paint() {
    api.render(STEP);
    requestAnimationFrame(paint);
  })();
</script>
</body>
</html>
