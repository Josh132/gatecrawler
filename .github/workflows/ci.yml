name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: syntax gate
        run: node --check src/game.js && node --check test/harness.mjs
      - name: harness
        run: node test/harness.mjs
      - name: seed sweep
        run: |
          fail=0
          for s in 2 999 12345 7 42 88888 314159 31337 777 55; do
            out=$(SEED=$s node test/harness.mjs 2>&1)
            echo "$out" | grep -E "RESULT|failsafe used"
            echo "$out" | grep -q "RESULT: PASS" || fail=1
            echo "$out" | grep -q "failsafe used 0x" || fail=1
          done
          exit $fail
