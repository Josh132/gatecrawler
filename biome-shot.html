<!doctype html>
<html>
<head><meta charset="utf-8"><title>biome shot</title>
<style>*{margin:0}html,body{background:#05070c;overflow:hidden}#game{display:block;width:100vw;height:100vh}
#d{position:fixed;right:4px;bottom:4px;color:#6f6;font:11px monospace;margin:0}</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="d"></pre>
<script type="module">
  import { createGame } from './src/game.js';
  import { initInput, keys, mouse } from './src/input.js';
  import { TILE, buildWorld, bakeWorld } from './src/worldgen.js';
  import { worldParams } from './src/address.js';
  import { makeFlowField } from './src/pathfind.js';

  const qs = new URLSearchParams(location.search);
  const BIOME = qs.get('b') || 'temple';
  const ADDR = qs.get('addr') || 'AUR-CRT-VIR-BOO-CEN-SER';
  const FRAMES = Number(qs.get('f') || 90);
  const NOFOG = qs.has('nofog');
  const canvas = document.getElementById('game');
  const api = createGame(canvas);
  initInput(canvas);
  const g = api.g;
  const STEP = 1 / 60;
  const key = (c) => window.dispatchEvent(new KeyboardEvent('keydown', { code: c }));

  g.postfx = false; // inspect raw textures, no bloom/grade wash
  key('Enter');
  api.update(STEP);
  api.render(STEP);
  // deploy straight out of the hub
  for (let i = 0; i < 200 && g.state !== 'play'; i++) {
    if (g.state === 'hub') { g.player.x = g.world.gateCenter.x; g.player.y = g.world.gateCenter.y; key('KeyE'); }
    else if (g.state === 'gatemap') { const n = g.buttons.find((b) => b.w >= 100 && b.h <= 60); if (n) n.fn(); }
    else key('Enter');
    api.update(STEP); api.render(STEP);
  }

  // swap in a world baked with the biome under test
  const t0 = performance.now();
  g.params = worldParams(ADDR, 4);
  g.params.biome = BIOME;
  g.world = buildWorld(g.params);
  const tb = performance.now();
  g.worldCanvas = bakeWorld(g.world);
  const bakeMs = performance.now() - tb;
  g.flow = makeFlowField(g.world.grid, g.world.W, g.world.H);
  g.enemies = []; g.bullets = []; g.grenades = []; g.blocks = []; g.hazards = []; g.pickups = [];
  const start = g.world.gateRoom.centerPx;
  g.player.x = start.x; g.player.y = start.y;
  g.cam.x = start.x; g.cam.y = start.y;
  if (NOFOG) g.visEnabled = false;

  const flow = makeFlowField(g.world.grid, g.world.W, g.world.H);
  const d = g.world.dhdRoom.centerPx;
  flow.compute(Math.floor(d.x / TILE), Math.floor(d.y / TILE));
  for (let t = 1; t <= FRAMES; t++) {
    const p = g.player;
    const tx = Math.max(1, Math.min(g.world.W - 2, Math.floor(p.x / TILE)));
    const ty = Math.max(1, Math.min(g.world.H - 2, Math.floor(p.y / TILE)));
    const [fx, fy] = flow.dir(tx, ty);
    for (const c of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) keys.delete(c);
    if (fx > 0.35) keys.add('KeyD');
    if (fx < -0.35) keys.add('KeyA');
    if (fy > 0.35) keys.add('KeyS');
    if (fy < -0.35) keys.add('KeyW');
    mouse.down = false;
    api.update(STEP);
    api.render(STEP);
  }
  document.getElementById('d').textContent =
    `${BIOME} | bake ${bakeMs.toFixed(1)}ms | total ${(performance.now() - t0).toFixed(0)}ms | ${g.world.W}x${g.world.H}`;
  document.title = 'biome ' + BIOME;
  (function paint() { api.render(STEP); requestAnimationFrame(paint); })();
</script>
</body>
</html>
